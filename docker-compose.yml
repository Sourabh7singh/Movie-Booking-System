services:
  api:
    build:
      context: ./apps/api
    container_name: moviebooking-api
    env_file:
      - ./.env
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    command: npm run dev

  web:
    build:
      context: ./apps/web
    container_name: moviebooking-web
    env_file:
      - ./.env
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

  postgres:
    image: postgres:15-alpine
    container_name: moviebooking-postgres
    environment:
      POSTGRES_DB: moviebooking
      POSTGRES_USER: moviebooking
      POSTGRES_PASSWORD: moviebooking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: moviebooking-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "moviebooking"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
